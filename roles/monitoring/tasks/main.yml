---
# 1. Update APT cache
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

# 2. Add Grafana repository
- name: Install Grafana repository prerequisites
  apt:
    name:
      - wget
      - gpg
    state: present
    update_cache: yes

- name: Add Grafana GPG key
  shell: |
    wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Update apt cache after adding Grafana repository
  apt:
    update_cache: yes

# 3. Install Monitoring Stack
- name: Install monitoring packages
  apt:
    name:
      - prometheus
      - grafana
      - prometheus-node-exporter
    state: present

# 3. Ensure Services are running and enabled
- name: Start and enable services
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - prometheus
    - grafana-server
    - prometheus-node-exporter

# 4. Provision Prometheus as Datasource in Grafana
- name: Create Grafana datasource provisioning config
  copy:
    dest: /etc/grafana/provisioning/datasources/datasource.yml
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:{{ prometheus_port }}
          isDefault: true

# 5. Provision a simple Dashboard
# 5. Provision a simple Dashboard
- name: Create Dashboard provisioning config
  copy:
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    content: |
      apiVersion: 1
      providers:
        - name: 'Default'
          orgId: 1
          folder: ''
          type: file
          options:
            path: /var/lib/grafana/dashboards

- name: Create Grafana dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: '0755'

- name: Copy dashboard JSON
  copy:
    dest: /var/lib/grafana/dashboards/cpu_mem.json
    content: |
      {
        "title": "CPU and Memory",
        "panels": [
          { "title": "CPU Usage", "type": "graph", "datasource": "Prometheus" },
          { "title": "Memory Usage", "type": "graph", "datasource": "Prometheus" }
        ]
      }

# 6. Restart Grafana to apply provisioning
- name: Restart Grafana
  systemd:
    name: grafana-server
    state: restarted
